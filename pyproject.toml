[project]
name = "ficelle"
version = "0.1.0"
description = "Serve any LeRobot policy over websockets — low-latency remote inference for real robots"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # MUST match the training revision of the checkpoints being served: this is
    # the commit the target pi0fast checkpoints were trained on (train/inference
    # version skew breaks pi0fast generation). Bump deliberately.
    "lerobot[pi,diffusion] @ git+https://github.com/huggingface/lerobot@e40b58a8dfa9e7b86918c374791599d070518d11",
    # runtime extras required by pi0fast-family policies.
    "scipy>=1.10",
    "sentencepiece",
    "num2words",
    "accelerate",
    "protobuf",
    # serving
    "websockets>=14",
    "ficelle-client",
    "iroh>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Scripts-only project: manage the dependency env, don't build/install this dir.
package = false

[tool.uv.sources]
ficelle-client = { path = "client", editable = true }

[tool.pytest.ini_options]
addopts = "-m 'not checkpoint'"
markers = [
    "checkpoint: downloads a real checkpoint and runs it (slow, wants a GPU); run with: uv run pytest -m checkpoint",
]
